<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>对白 · 语音工作台</title>
<style>
:root{--ink:#183444;--muted:#647785;--line:#dce7ed;--blue:#2474b8;--teal:#147b78;--bg:#f3f7fa;--card:#fff;--error:#a32c37;--shadow:0 8px 32px #28445508}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button,input,select{min-height:44px}button,a.button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:9px 16px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s}button:hover,a.button:hover{background:#f4f8fa;border-color:#bed3df}button:disabled{cursor:not-allowed;opacity:.48}button.primary,a.primary{background:var(--teal);color:#fff;border-color:var(--teal)}button.primary:hover,a.primary:hover{background:#106966}button.danger{color:var(--error)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #82bdd9;outline-offset:3px}main{max-width:1200px;margin:0 auto;padding:40px 28px 56px}.masthead{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--teal);font-weight:700;letter-spacing:1px}.mark{width:32px;height:32px;background:var(--teal);border-radius:10px;display:flex;gap:3px;align-items:center;justify-content:center}.mark i{display:block;width:3px;border-radius:5px;background:#fff;height:12px}.mark i:nth-child(2){height:21px}.mark i:nth-child(3){height:16px}h1{font-size:30px;letter-spacing:-.7px;line-height:1.35;margin:16px 0 8px}h2{font-size:18px;margin:0}h3{font-size:15px;margin:0}p{margin:0}.subtitle{color:var(--muted)}.badge{white-space:nowrap;border:1px solid #cfe4e0;background:#e9f5f1;color:#206f65;padding:5px 12px;border-radius:99px;font-size:12px;margin-top:6px}.workspace{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}.stack{display:grid;gap:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow);min-width:0}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.step{display:inline-flex;align-items:center;justify-content:center;background:#edf5fa;color:var(--blue);font-size:12px;font-weight:700;width:25px;height:25px;border-radius:8px;margin-right:8px;vertical-align:2px}.muted{font-size:13px;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.importrow{display:flex;gap:8px;margin-bottom:12px}.filelabel{min-height:44px;display:inline-flex;align-items:center;padding:9px 15px;background:#f4f9fb;border:1px dashed #b9cdd9;border-radius:10px;font-weight:600;cursor:pointer}.filelabel:hover{background:#edf4f7}.filename{font-size:12px;overflow-wrap:anywhere;color:var(--muted);margin-bottom:8px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}textarea{width:100%;height:242px;resize:vertical;border:1px solid var(--line);border-radius:11px;background:#f9fbfc;padding:14px;line-height:1.65;font-size:13px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#234758}label.field{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:13px;font-weight:600}input[type=text],input[type=number],select{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--ink);background:#fff}input[type=range]{width:100%;accent-color:var(--teal);padding:0}.mapping{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.mapping .full{grid-column:1/-1}.hint{font-size:12px;color:var(--muted);font-weight:400}.previewhead{display:flex;gap:8px;flex-wrap:wrap;margin:17px 0 12px}.count{background:#eff5f8;border-radius:6px;color:#506b7b;padding:3px 9px;font-size:12px}.preview{max-height:280px;overflow:auto;border-top:1px solid var(--line)}.line{display:grid;grid-template-columns:24px 56px 1fr;gap:8px;padding:12px 0;border-bottom:1px solid #edf2f5;font-size:13px}.line .number{color:#8a9da7;font-size:11px;padding-top:3px}.role{font-size:11px;font-weight:700;color:var(--teal);background:#eaf6f2;border-radius:5px;padding:2px 6px;align-self:start;overflow-wrap:anywhere}.line:nth-child(even) .role{color:var(--blue);background:#edf4fb}.line .text{white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:11px}.voices{display:grid;gap:14px;margin-bottom:20px}.voicerow{display:grid;grid-template-columns:minmax(70px,.55fr) minmax(0,1.5fr);align-items:center;gap:12px}.speakername{font-size:14px;font-weight:600;overflow-wrap:anywhere}.voicehint{display:block;font-size:11px;font-weight:400;color:var(--muted)}.sliders{border-top:1px solid var(--line);padding-top:18px;display:grid;gap:18px}.sliderlabel{display:flex;justify-content:space-between;font-size:13px;font-weight:600}.value{color:var(--teal);font-variant-numeric:tabular-nums}.privacy{background:#f1f8f7;border:1px solid #d5e9e4;border-radius:10px;padding:12px 13px;margin:18px 0 14px;font-size:12px;color:#486b69}.consent{display:flex;align-items:start;gap:9px;font-size:13px;line-height:1.55;cursor:pointer;margin-bottom:17px}.consent input{accent-color:var(--teal);min-height:auto;margin-top:4px;width:17px;height:17px;flex-shrink:0}.runbuttons{display:flex;gap:10px}.runbuttons .primary{flex:1}.status{margin-top:17px;font-size:13px;color:var(--muted)}progress{display:block;width:100%;height:7px;border:0;border-radius:99px;overflow:hidden;margin-top:9px;background:#e7eff2}progress::-webkit-progress-bar{background:#e7eff2}progress::-webkit-progress-value{background:var(--teal)}progress::-moz-progress-bar{background:var(--teal)}.error{padding:12px 14px;background:#fff1f1;border:1px solid #edc9cd;border-radius:10px;color:var(--error);font-size:13px;margin:14px 0;white-space:pre-wrap;overflow-wrap:anywhere}.warning{padding:10px 12px;background:#fff9e9;border:1px solid #eedfbc;border-radius:9px;color:#7a602a;font-size:12px;margin:12px 0;white-space:pre-wrap}.result{border-color:#b9dcd4;background:linear-gradient(145deg,#fff,#f6fbf9)}.result audio{width:100%;margin:16px 0 14px}.result .actions a{font-size:13px}.footer{margin-top:25px;color:#7b8e99;font-size:12px}.busyfield:disabled{opacity:.55}.hidden,[hidden]{display:none!important}@media(max-width:800px){main{padding:24px 16px 40px}.workspace{grid-template-columns:1fr}.masthead{margin-bottom:21px}.badge{display:none}h1{font-size:26px}.card{padding:20px;border-radius:15px}.cardhead{margin-bottom:15px}.subtitle{font-size:14px}.line{grid-template-columns:20px 54px 1fr}.voicerow{grid-template-columns:78px 1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Calm desktop app shell; compact labels replace marketing subtitles. */
:root{--ink:#1d343d;--muted:#798990;--line:#e3eaec;--blue:#3d789c;--teal:#207568;--bg:#f5f7f7;--shadow:0 12px 38px #1b3d4610}
body{background:radial-gradient(ellipse at 10% 0%,#eaf1ee80,transparent 48%),var(--bg)}
main{max-width:1160px;padding:34px 30px 34px}.masthead{align-items:center;margin-bottom:30px}.brand{gap:13px;letter-spacing:0;color:var(--ink)}.brand h1{margin:0;font-size:29px;font-weight:650;letter-spacing:-1px}.brandnote{font-size:12px;color:#87979c;letter-spacing:.8px;margin-left:7px}.mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#1e7b70,#285c57);box-shadow:0 5px 15px #1e73611c}.headeractions{display:flex;align-items:center;gap:12px}.badge{display:inline-flex;align-items:center;gap:7px;margin:0;background:transparent;border:0;color:#7c8b8b;padding:0;font-size:12px}.dot{width:6px;height:6px;border-radius:50%;background:#7aa899}#shutdown{font-size:12px;min-height:38px;background:transparent;border-color:#dde5e5;border-radius:12px;padding:7px 12px}
.card{border-radius:23px;border-color:#e5ebec;padding:25px;box-shadow:0 9px 30px #1d424905}.cardhead{margin-bottom:19px}.cardhead h2{font-size:16px;font-weight:650;letter-spacing:.5px}.workspace,.stack{gap:20px}.workspace{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr)}
button,a.button{border-radius:13px;font-size:13px;padding:10px 16px;font-weight:600}button.primary,a.primary{box-shadow:0 5px 12px #20756812}#example{border:0;background:#f3f6f5;color:#597068;padding:8px 12px;font-size:12px;min-height:36px}.filelabel{border-style:solid;border-color:#e0e9e7;background:#f3f8f6;color:#3d6c62;border-radius:13px;font-size:13px}.filename{margin:1px 0 12px;font-size:11px;color:#91a0a5}textarea{border-radius:15px;background:#f8fafb;border-color:#e7eeef;height:236px;padding:16px;color:#45606b;font-size:12px}input[type=text],input[type=number],select{border-radius:12px;border-color:#e1e9eb;font-size:13px;background:#fff}label.field{font-size:12px;color:#667a83;font-weight:500}.mapping{gap:13px;margin:17px 0}.hint{font-size:11px;color:#97a4a8}.empty{border-style:solid;border-color:#edf1f2;background:#fafcfc;border-radius:14px;color:#91a0a6;font-size:12px;padding:22px 12px}.preview{border-color:#ecf0f1}.line{padding:13px 0}.role{border-radius:7px;padding:3px 7px;font-weight:600}.count{border-radius:8px;font-size:11px;background:#f1f5f5;color:#7a8e94}.voices{gap:17px;margin-bottom:24px}.speakername{font-size:13px;color:#46616b}.voicehint{color:#98a6a9;font-size:10px}.sliders{padding-top:22px;gap:19px;border-color:#edf1f2}.sliderlabel{font-size:12px;color:#657b83}.value{font-weight:500}.consent{font-size:12px;color:#819196;margin-top:22px;margin-bottom:17px;align-items:center}.consent input{width:16px;height:16px;margin-top:0}.result{background:#fff;border-color:#d6e6e0}.result audio{margin-top:2px}.result .actions a{font-size:12px}.footer{display:flex;align-items:start;justify-content:space-between;gap:20px;font-size:11px;color:#9aa8ad;margin:20px 3px 0}.footer details{max-width:360px;text-align:right}.footer summary{cursor:pointer;list-style:none;color:#8b9a9f}.footer summary::-webkit-details-marker{display:none}.footer details p{padding-top:8px;line-height:1.7}.shutdownstate{max-width:560px;margin:80px auto;text-align:center;padding:38px}.shutdownstate h2{font-size:23px;margin-bottom:8px}.shutdownstate p{color:var(--muted);font-size:14px}
@media(max-width:800px){main{padding:24px 16px 28px}.masthead{margin-bottom:23px}.workspace{grid-template-columns:1fr}.brand h1{font-size:26px}.brandnote{font-size:10px;margin-left:0}.headeractions .badge{display:none}.headeractions{gap:0}.card{padding:21px;border-radius:21px}.footer{font-size:10px;gap:16px}.footer details{max-width:190px}#shutdown{min-height:44px;font-size:11px;padding:7px 10px}}
@media(max-width:360px){.brandnote{display:none}}

.updatewrap{position:relative}#checkupdate{font-size:12px;min-height:38px;background:transparent;border-color:#dde5e5;border-radius:12px;padding:7px 12px}.updatepanel{position:absolute;top:calc(100% + 10px);right:0;width:270px;max-width:calc(100vw - 32px);padding:15px 17px;background:#fff;border:1px solid #e2eae8;border-radius:16px;box-shadow:0 12px 36px #1c3e4820;z-index:10;font-size:12px;line-height:1.7;color:#667e83;overflow-wrap:anywhere}.updatepanel a{display:block;color:var(--teal);font-weight:600;text-decoration:none;margin-top:8px;padding:6px 0}.updatepanel a:hover{text-decoration:underline}.updatepanel small{display:block;font-size:10px;color:#8b9b9f}.updatepanel.is-error{color:var(--error)}
@media(max-width:800px){.headeractions{gap:7px}#checkupdate{min-height:44px;font-size:11px;padding:7px 10px}.updatepanel{right:-75px;width:270px}.brandnote{display:none}}

.xmlfiles{display:grid;gap:10px;margin:13px 0}.xmlfile{display:flex;align-items:center;gap:12px;background:#f7faf9;border:1px solid #e3ece8;padding:13px 14px;border-radius:14px;min-width:0}.xmlfile .channel{flex:0 0 27px;width:27px;height:27px;border-radius:9px;background:#e5f1ec;display:flex;align-items:center;justify-content:center;color:#337b67;font-size:12px;font-weight:650}.xmlfile:nth-child(2) .channel{color:#467c99;background:#eaf2f7}.xmlfile .filetext{font-size:12px;color:#6a8087;overflow-wrap:anywhere;min-width:0}.xmltools{display:flex;gap:8px;margin-top:13px}.xmltools button{min-height:36px;padding:7px 11px;font-size:11px;color:#6b838b;background:#f7f9fa;border-color:#e5ebed}.xmlhint{font-size:11px;color:#8b9ca1;line-height:1.6;margin:12px 0 17px}.linebody{min-width:0}.linetime{display:flex;gap:8px;flex-wrap:wrap;font-size:10px;font-variant-numeric:tabular-nums;color:#8ea1a7;margin-bottom:3px}.overlap{color:#9c7937}.linebody .text{display:block}
.xmltools{align-items:end;flex-wrap:wrap}.xmlunit{display:flex;flex-direction:column;gap:5px;font-size:10px;color:#8b9ca1;min-width:84px}.xmlunit select{min-height:36px;font-size:11px;padding:6px 9px}.mutedline{opacity:.65}.skiplabel{color:#99a5a8;font-size:10px;margin-left:6px}
</style>
</head>
<body>
<main>
<header class="masthead"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><h1>对白</h1><span class="brandnote">JSON / XML → MP3</span></div><div class="headeractions"><span class="badge"><span class="dot"></span>本机工作台</span><div class="updatewrap"><button id="checkupdate" type="button" aria-expanded="false" aria-controls="updatepanel">检查更新</button><div id="updatepanel" class="updatepanel" role="status" hidden><span id="updatestatus"></span><a id="updatelink" target="_blank" rel="noopener noreferrer" hidden>获取更新</a><small id="updatehint" hidden>下载后替换应用</small></div></div><button id="shutdown" type="button" hidden>退出应用</button></div></header><section id="shutdownstate" class="card shutdownstate" hidden role="status"><h2>应用已退出</h2><p>可以关闭这个页面。</p></section>
<div class="workspace">
<section class="card" aria-labelledby="importtitle">
<div class="cardhead"><h2 id="importtitle">对话</h2><button id="example" class="busyfield" type="button">载入示例</button></div>
<div class="importrow"><label class="filelabel" for="file">选择文件</label><input id="file" class="sr-only busyfield" type="file" accept=".json,.xml,application/json,application/xml,text/xml" multiple></div>
<div id="filename" class="filename">1 个 JSON，或同一通对话的 2 个 XML · 原文件不变</div>
<div id="jsoneditor"><label for="source" class="sr-only">JSON 内容</label><textarea id="source" class="busyfield" spellcheck="false" placeholder='[{"speaker":"A","text":"你好。"},{"speaker":"B","text":"很高兴认识你。"}]'></textarea>
<div class="mapping">
<label class="field full">对话数组位置<input id="arraypath" class="busyfield" type="text" value="" placeholder="留空表示根数组，例如 data.messages"><span class="hint">空白 = 根数组；嵌套数组例如 data.messages。</span></label>
<label class="field">说话人字段<input id="speakerkey" class="busyfield" type="text" value="speaker" placeholder="speaker"></label>
<label class="field">文本字段<input id="textkey" class="busyfield" type="text" value="text" placeholder="text"></label>
</div>
</div><div id="xmlpanel" hidden><div id="xmlfiles" class="xmlfiles"></div><div class="xmltools"><label class="xmlunit" for="xmlunit">时间单位<select id="xmlunit" class="busyfield"><option value="ms">毫秒</option><option value="s">秒</option></select></label><button id="swapxml" class="busyfield" type="button">交换 A / B</button><button id="jsonmode" class="busyfield" type="button">改用 JSON</button></div><p class="xmlhint">A / B 表示文件分组，不预设左右声道。</p></div>
<button id="previewbutton" class="busyfield" type="button">解析并预览</button>
<div id="inputerror" class="error" role="alert" hidden></div><div id="warnings" class="warning" hidden></div>
<div id="previewmeta" class="previewhead" hidden></div>
<div id="previewempty" class="empty" style="margin-top:18px">解析后，对话会按原顺序出现在这里。</div><div id="preview" class="preview" hidden aria-label="对话预览"></div>
</section>
<div class="stack">
<section class="card" aria-labelledby="voicetitle">
<div class="cardhead"><h2 id="voicetitle">声音</h2></div>
<div id="voiceempty" class="empty">先解析对话，再为角色选声音。</div><div id="voices" class="voices" hidden></div>
<div class="sliders">
<div><label class="sliderlabel" for="rate">语速<span id="ratevalue" class="value">1.00 ×</span></label><input id="rate" class="busyfield" type="range" min="0.5" max="2" step="0.05" value="1"></div>
<div><label class="sliderlabel" for="pause">段间停顿<span id="pausevalue" class="value">250 ms</span></label><input id="pause" class="busyfield" type="range" min="0" max="3000" step="50" value="250"></div>
</div>

<label class="consent"><input id="consent" class="busyfield" type="checkbox"><span>允许将本次文本发送给微软合成语音</span></label>
<div class="runbuttons"><button id="generate" class="primary" type="button" disabled>生成完整 MP3</button><button id="cancel" class="danger" type="button" hidden>取消</button></div>
<div id="joberror" class="error" role="alert" hidden></div>
<div id="statusbox" class="status" aria-live="polite" hidden><span id="status"></span><progress id="progress" value="0" max="1"></progress></div>
</section>
<section id="result" class="card result" hidden aria-labelledby="resulttitle"><div class="cardhead"><h2 id="resulttitle">试听与下载</h2><span id="duration" class="muted"></span></div><audio id="audio" controls preload="metadata"></audio><div class="actions"><a id="download" class="button primary" download="dialogue.mp3">下载 MP3</a><a id="normalized" class="button" download="dialogue.normalized.json">下载转换后的 JSON</a></div></section>
</div>
</div>
<footer class="footer"><span>通用音色 · 只使用已脱敏文本</span><details><summary>服务说明</summary><p>解析在本机完成，合成时需要联网。不会克隆原声或自动对齐原录音时间轴；在线服务可能限流或中断。</p></details></footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let config=null, parsed=null, voiceMap=Object.create(null), activeJob=null, pollTimer=null, requestSequence=0, pending=false, fileReadSequence=0, readingFile=false, pendingRequestId=null, pendingPayloadKey=null, sourceFormat='json', xmlFiles=[];
function resetRequest(){pendingRequestId=null;pendingPayloadKey=null;}
function requestId(){return crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');}
function rememberJob(id){try{if(id)sessionStorage.setItem('dialogue.activeJob',id);else sessionStorage.removeItem('dialogue.activeJob');}catch(e){}}
function restoreJob(){try{return sessionStorage.getItem('dialogue.activeJob');}catch(e){return null;}}
const exampleFallback=[{speaker:'A',text:'你好，我想订一个明天下午两点的会议室。'},{speaker:'B',text:'可以，请问大约有几位参加，需要投影设备吗？'},{speaker:'A',text:'一共六位，需要投影，另外准备一些饮用水就好。'},{speaker:'B',text:'好的，已经记下。会议预计持续多久呢？'},{speaker:'A',text:'大概一个小时，如果提前结束，我会通知你。'},{speaker:'B',text:'没问题，明天下午见。'}];
function errorAt(id,message){$(id).textContent=message||'';$(id).hidden=!message;}
function clearResult(){ $('audio').pause();$('audio').removeAttribute('src');$('audio').load();$('result').hidden=true;$('download').removeAttribute('href');$('normalized').removeAttribute('href'); }
function lineCount(){return Array.isArray(parsed?.script?.lines)?parsed.script.lines.length:(parsed?.rows||[]).filter(row=>!row.muted).length;}
function updateGenerate(){ $('generate').disabled=!config||!parsed||!lineCount()||!$('consent').checked||!!activeJob||pending||readingFile; }
function lock(value){const disabled=!!(value||pending||readingFile||activeJob);document.querySelectorAll('.busyfield').forEach(el=>el.disabled=disabled);$('cancel').hidden=!activeJob;updateGenerate();}
function invalidate(){requestSequence++;resetRequest();parsed=null;voiceMap=Object.create(null);$('preview').replaceChildren();$('preview').hidden=true;$('previewmeta').hidden=true;$('previewempty').hidden=false;$('voices').replaceChildren();$('voices').hidden=true;$('voiceempty').hidden=false;errorAt('inputerror','');$('warnings').hidden=true;clearResult();if(!activeJob)$('statusbox').hidden=true;updateGenerate();}
function setSourceMode(mode){sourceFormat=mode;$('jsoneditor').hidden=mode!=='json';$('xmlpanel').hidden=mode!=='xml_pair';}
function renderXmlFiles(){$('xmlfiles').replaceChildren();xmlFiles.forEach((file,index)=>{const row=document.createElement('div');row.className='xmlfile';const channel=document.createElement('span');channel.className='channel';channel.textContent=index===0?'A':'B';const name=document.createElement('span');name.className='filetext';name.textContent=file.name;row.append(channel,name);$('xmlfiles').append(row);});}
function sourcePayload(){const common={rate:Number($('rate').value),pause_ms:Number($('pause').value),voices:{...voiceMap}};if(sourceFormat==='xml_pair'){if(xmlFiles.length!==2)throw new Error('请同时选择同一通对话的两个 XML 文件。');return{format:'xml_pair',xml_time_unit:$('xmlunit').value,xml_files:xmlFiles.map(file=>({name:file.name,content:file.content})),...common};}let data;try{data=JSON.parse($('source').value);}catch(e){throw new Error('JSON 格式不正确：'+e.message);}return{data,array_path:$('arraypath').value.trim(),speaker_key:$('speakerkey').value.trim(),text_key:$('textkey').value.trim(),...common};}
function timestamp(value){const ms=Math.max(0,Math.floor(value));const hours=Math.floor(ms/3600000),minutes=Math.floor(ms/60000)%60,seconds=Math.floor(ms/1000)%60;return(hours?String(hours).padStart(2,'0')+':':'')+String(minutes).padStart(2,'0')+':'+String(seconds).padStart(2,'0')+'.'+String(ms%1000).padStart(3,'0');}
async function api(path,options={}){const headers={'Accept':'application/json',...(options.headers||{})};if(options.body){headers['Content-Type']='application/json';headers['X-App-Token']=config.token;}let response;try{response=await fetch(path,{...options,headers,credentials:'same-origin',cache:'no-store'});}catch(e){throw new Error('无法连接本机服务，请确认后端仍在运行。');}let data;try{data=await response.json();}catch(e){throw new Error('服务返回了无法识别的响应。');}if(!response.ok){const error=new Error(data.error||data.message||'请求失败（'+response.status+'）');error.status=response.status;throw error;}return data;}
function pill(text){const el=document.createElement('span');el.className='count';el.textContent=text;return el;}
function displayPreview(result){parsed=result;const rows=result.rows||[];const speakers=result.speakers||[];$('previewmeta').replaceChildren(pill(rows.length+' 段对话'),pill(speakers.length+' 位说话人'));const skipped=rows.filter(row=>row.muted).length;if(skipped)$('previewmeta').append(pill('跳过 '+skipped+' 段静音'));$('previewmeta').hidden=false;$('preview').replaceChildren();rows.forEach((row,i)=>{const line=document.createElement('div');line.className='line'+(row.muted?' mutedline':'');const n=document.createElement('span');n.className='number';n.textContent=String(i+1).padStart(2,'0');const role=document.createElement('span');role.className='role';role.textContent=String(row.speaker);const body=document.createElement('span');body.className='linebody';if(typeof row.start_ms==='number'&&Number.isFinite(row.start_ms)&&row.start_ms>=0){const timing=document.createElement('span');timing.className='linetime';const label=document.createElement('span');label.textContent=timestamp(row.start_ms)+(typeof row.end_ms==='number'&&Number.isFinite(row.end_ms)&&row.end_ms>=row.start_ms?' – '+timestamp(row.end_ms):'');timing.append(label);if(row.overlap){const overlap=document.createElement('span');overlap.className='overlap';overlap.textContent='原音频重叠';timing.append(overlap);}body.append(timing);}const txt=document.createElement('span');txt.className='text';txt.textContent=row.muted?'已静音片段':row.text;if(row.muted){const skipped=document.createElement('span');skipped.className='skiplabel';skipped.textContent='跳过';txt.append(skipped);}body.append(txt);line.append(n,role,body);$('preview').append(line);});$('preview').hidden=false;$('previewempty').hidden=true;
const defaults=['zh-CN-XiaoxiaoNeural','zh-CN-XiaoyiNeural'];const old=voiceMap;voiceMap=Object.create(null);$('voices').replaceChildren();speakers.forEach((speaker,index)=>{const key=typeof speaker==='string'?speaker:String(speaker.id??speaker.speaker);const row=document.createElement('div');row.className='voicerow';const label=document.createElement('label');label.className='speakername';label.textContent=key;const hint=document.createElement('span');hint.className='voicehint';hint.textContent='固定角色音色';label.append(hint);const select=document.createElement('select');select.className='busyfield';select.id='voice-'+index;label.htmlFor=select.id;(config.voices||[]).forEach(voice=>{const option=document.createElement('option');option.value=voice.id;option.textContent=voice.label;select.append(option);});select.value=old[key]||defaults[index%defaults.length];if(!select.value&&select.options.length)select.selectedIndex=0;voiceMap[key]=select.value;select.addEventListener('change',()=>{voiceMap[key]=select.value;resetRequest();clearResult();});row.append(label,select);$('voices').append(row);});$('voices').hidden=false;$('voiceempty').hidden=true;const warnings=[...(result.warnings||[])];if(sourceFormat==='xml_pair'&&!warnings.some(value=>String(value).includes('不还原原始时长'))){warnings.push('按时间排序串行配音，不还原原始时长。');}$('warnings').textContent=warnings.join('\n');$('warnings').hidden=!warnings.length;updateGenerate();}
async function preview(){if(activeJob||pending)return;errorAt('inputerror','');errorAt('joberror','');clearResult();let payload;try{payload=sourcePayload();}catch(e){invalidate();errorAt('inputerror',e.message);return;}const seq=++requestSequence;pending=true;lock(true);$('previewbutton').textContent='正在解析…';try{const result=await api('/api/preview',{method:'POST',body:JSON.stringify(payload)});if(seq===requestSequence)displayPreview(result);}catch(e){if(seq===requestSequence){parsed=null;errorAt('inputerror',e.message);}}finally{pending=false;$('previewbutton').textContent='解析并预览';lock(false);}}
function setStatus(message,completed,total){$('statusbox').hidden=false;$('status').textContent=message;$('progress').max=Math.max(total||1,1);$('progress').value=completed||0;}
async function poll(){if(!activeJob)return;const id=activeJob;try{const job=await api('/api/jobs/'+encodeURIComponent(id));if(activeJob!==id)return;errorAt('joberror','');const finished=['done','error','cancelled'].includes(job.status);if(job.status==='done'){setStatus('全部完成 · '+job.total+' 句',job.total,job.total);$('duration').textContent=Number.isFinite(job.duration_ms)?(job.duration_ms/1000).toFixed(1)+' 秒':'';if(job.download_url){$('audio').src=job.download_url;$('download').href=job.download_url;}if(job.normalized_url){$('normalized').href=job.normalized_url;$('normalized').hidden=false;}else $('normalized').hidden=true;$('result').hidden=false;}else if(job.status==='error'){errorAt('joberror',job.error||'语音生成失败，请稍后重试。');setStatus('生成未完成',job.completed,job.total);}else if(job.status==='cancelled'){setStatus('已取消，本次未完成的音频不会作为结果导出。',job.completed,job.total);}else{setStatus((job.status==='queued'?'等待开始':'正在合成')+' · '+(job.completed||0)+' / '+(job.total||lineCount()||0)+' 句',job.completed,job.total);}
if(finished){activeJob=null;resetRequest();rememberJob(null);lock(false);return;}pollTimer=setTimeout(poll,1000);}catch(e){if(e.status===404){activeJob=null;rememberJob(null);lock(false);errorAt('joberror','任务记录不存在，后端可能已重启。请重新解析文件后再生成。');return;}errorAt('joberror',e.message+' 正在尝试重新连接；任务可能仍在运行，请勿重复提交。');pollTimer=setTimeout(poll,2500);}}
async function generate(){if(!parsed||!lineCount()||pending||activeJob||!$('consent').checked)return;errorAt('joberror','');clearResult();pending=true;lock(true);setStatus('正在提交合成任务…',0,lineCount());try{const payload=sourcePayload();payload.consent=true;const key=JSON.stringify(payload);if(!pendingRequestId||pendingPayloadKey!==key){pendingRequestId=requestId();pendingPayloadKey=key;}payload.request_id=pendingRequestId;const job=await api('/api/jobs',{method:'POST',body:JSON.stringify(payload)});activeJob=job.id;rememberJob(activeJob);$('cancel').disabled=false;$('cancel').textContent='取消';$('cancel').hidden=false;poll();}catch(e){errorAt('joberror',e.message+(e.status?'':' 提交结果尚未确认；可点击生成重试，同一请求会复用编号，避免重复创建任务。'));$('statusbox').hidden=true;}finally{pending=false;lock(!!activeJob);}}
async function cancel(){if(!activeJob)return;const id=activeJob;$('cancel').disabled=true;$('cancel').textContent='取消中…';try{await api('/api/jobs/'+encodeURIComponent(id)+'/cancel',{method:'POST',body:'{}'});if(pollTimer)clearTimeout(pollTimer);await poll();}catch(e){errorAt('joberror',e.message);$('cancel').disabled=false;$('cancel').textContent='重试取消';}}
function hideUpdate(){ $('updatepanel').hidden=true;$('checkupdate').setAttribute('aria-expanded','false'); }
function safeReleaseUrl(value){if(typeof value!=='string')return null;try{const url=new URL(value);if(url.protocol!=='https:'||url.hostname!=='github.com'||url.port||url.username||url.password||url.search||url.hash||!url.pathname.startsWith('/Harry6400/dialogue-tts/releases/'))return null;return url.href;}catch(e){return null;}}
$('checkupdate').addEventListener('click',async()=>{
if($('checkupdate').disabled)return;
$('checkupdate').disabled=true;$('checkupdate').textContent='检查中…';$('checkupdate').setAttribute('aria-expanded','true');$('updatepanel').hidden=false;$('updatepanel').classList.remove('is-error');$('updatestatus').textContent='正在检查更新…';$('updatelink').hidden=true;$('updatelink').removeAttribute('href');$('updatehint').hidden=true;
const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),9000);
try{const response=await fetch('/api/update',{headers:{'Accept':'application/json'},credentials:'same-origin',cache:'no-store',signal:controller.signal});let data;try{data=await response.json();}catch(e){if(response.status!==404)throw new Error('invalid response');}
if(response.status===404||data?.state==='unreleased'){$('updatestatus').textContent='尚无正式更新版本。';}
else if(!response.ok||!data||data.state==='error'){throw new Error('update unavailable');}
else if(data.state==='latest'){$('updatestatus').textContent='已是最新版本'+(typeof data.current_version==='string'?' · '+data.current_version:'');}
else if(data.state==='available'){const url=safeReleaseUrl(data.release_url||data.download_url);if(!url)throw new Error('unsafe release URL');$('updatestatus').textContent='发现新版本'+(typeof data.latest_version==='string'?' · '+data.latest_version:'');$('updatelink').href=url;$('updatelink').hidden=false;$('updatehint').hidden=false;}
else throw new Error('unknown update state');
}catch(e){$('updatepanel').classList.add('is-error');$('updatestatus').textContent=controller.signal.aborted?'检查超时，请重试。':'暂时无法检查更新，请重试。';$('updatelink').hidden=true;$('updatelink').removeAttribute('href');$('updatehint').hidden=true;}
finally{clearTimeout(timeout);$('checkupdate').disabled=false;$('checkupdate').textContent='检查更新';}
});
document.addEventListener('click',event=>{if(!event.target.closest('.updatewrap'))hideUpdate();});document.addEventListener('keydown',event=>{if(event.key==='Escape')hideUpdate();});
$('shutdown').addEventListener('click',async()=>{
if(!config?.can_shutdown)return;
if(!window.confirm('退出会停止任务并清除临时文件，请先下载音频。确定退出？'))return;
$('shutdown').disabled=true;
try{await api('/api/shutdown',{method:'POST',body:'{}'});if(pollTimer)clearTimeout(pollTimer);activeJob=null;rememberJob(null);resetRequest();$('audio').pause();document.querySelector('.workspace').hidden=true;document.querySelector('.footer').hidden=true;$('shutdown').hidden=true;$('checkupdate').hidden=true;hideUpdate();$('shutdownstate').hidden=false;}
catch(e){errorAt('joberror','退出未确认：'+e.message);$('shutdown').disabled=false;}
});
$('file').addEventListener('change',async event=>{
const files=Array.from(event.target.files||[]);if(!files.length||activeJob||pending)return;
const readSequence=++fileReadSequence;readingFile=true;invalidate();$('source').value='';xmlFiles=[];setSourceMode('json');renderXmlFiles();$('filename').textContent='正在读取 '+files.map(file=>file.name).join('、')+'…';lock(true);
try{
const isJson=files.length===1&&/\.json$/i.test(files[0].name);const isXmlPair=files.length===2&&files.every(file=>/\.xml$/i.test(file.name));
if(!isJson&&!isXmlPair)throw new Error('请选择 1 个 JSON，或同时选择同一通对话的 2 个 XML；不能混选。');
if(files.some(file=>file.size>2*1024*1024)||files.reduce((sum,file)=>sum+file.size,0)>4*1024*1024)throw new Error('每个文件不能超过 2 MB，两个 XML 合计不能超过 4 MB。');
const contents=await Promise.all(files.map(file=>file.text()));if(readSequence!==fileReadSequence||activeJob)return;
if(isXmlPair){xmlFiles=files.map((file,index)=>({name:file.name,content:contents[index]}));setSourceMode('xml_pair');renderXmlFiles();$('filename').textContent='已载入双文件 · 原文件保持不变';}
else{$('source').value=contents[0];$('filename').textContent='已载入 '+files[0].name+' · 原文件保持不变';}
}catch(e){if(readSequence===fileReadSequence){event.target.value='';$('filename').textContent='文件未载入 · 原文件保持不变';errorAt('inputerror',e.message||'无法读取文件，请重新选择。');}}
finally{if(readSequence===fileReadSequence){readingFile=false;lock(false);}}
});
$('xmlunit').addEventListener('change',()=>{if(!activeJob&&!pending&&!readingFile)invalidate();});
$('swapxml').addEventListener('click',()=>{if(activeJob||pending||readingFile||xmlFiles.length!==2)return;xmlFiles.reverse();invalidate();renderXmlFiles();preview();});
$('jsonmode').addEventListener('click',()=>{if(activeJob||pending||readingFile)return;xmlFiles=[];setSourceMode('json');renderXmlFiles();$('file').value='';$('filename').textContent='导入或粘贴 JSON · 原文件不变';invalidate();});
$('source').addEventListener('input',invalidate);['arraypath','speakerkey','textkey'].forEach(id=>$(id).addEventListener('input',invalidate));$('example').addEventListener('click',()=>{xmlFiles=[];setSourceMode('json');renderXmlFiles();$('source').value=JSON.stringify(config?.example||exampleFallback,null,2);$('arraypath').value='';$('speakerkey').value='speaker';$('textkey').value='text';$('filename').textContent='内置示例 · 会议室预约';$('file').value='';invalidate();preview();});$('previewbutton').addEventListener('click',preview);$('generate').addEventListener('click',generate);$('cancel').addEventListener('click',cancel);$('consent').addEventListener('change',updateGenerate);$('rate').addEventListener('input',()=>{$('ratevalue').textContent=Number($('rate').value).toFixed(2)+' ×';resetRequest();clearResult();});$('pause').addEventListener('input',()=>{$('pausevalue').textContent=$('pause').value+' ms';resetRequest();clearResult();});
window.addEventListener('beforeunload',event=>{if(activeJob){event.preventDefault();event.returnValue='';}});
(async()=>{try{config=await api('/api/config');$('shutdown').hidden=!config.can_shutdown;activeJob=restoreJob();if(activeJob){lock(true);setStatus('正在恢复任务状态…',0,1);poll();}else updateGenerate();}catch(e){errorAt('inputerror',e.message+' 刷新页面可以重试。');}})();
</script>
