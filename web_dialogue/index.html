.regenerate{display:flex;gap:7px;align-items:center;font-size:11px;color:#667b83}.regenerate input{min-height:0;accent-color:var(--teal)}.folderpath{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:#667b83}.folderrow{display:flex;align-items:center;gap:7px;min-width:0;margin:8px 0}.folderrow .folderpath{flex:1}.folderrow button{flex-shrink:0;min-height:30px;font-size:11px;padding:5px 8px}.exportstate{display:flex;align-items:center;gap:7px;min-width:0;margin-top:5px}.exportlabel{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--teal)}.exportstate button{font-size:11px;min-height:28px;padding:3px 7px}#foldererror{max-height:48px}#manualpair{display:none!important}
</style>
</head>
<body>
<main>
<header class="masthead"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><h1>对白</h1><span class="brandnote">XML → MP3</span></div><div class="headeractions"><span class="badge"><span class="dot"></span>本机工作台</span><div class="updatewrap"><button id="checkupdate" type="button" aria-expanded="false" aria-controls="updatepanel">检查更新</button><div id="updatepanel" class="updatepanel" role="status" hidden><span id="updatestatus"></span><a id="updatelink" target="_blank" rel="noopener noreferrer" hidden>获取更新</a><button id="installupdate" type="button" hidden>安装并重启</button><div id="updatepending" hidden style="max-height:180px;overflow:auto"></div><small id="updatehint" hidden>设置和结果文件夹保持不变</small></div></div><button id="shutdown" type="button" hidden>退出应用</button></div></header><section id="shutdownstate" class="card shutdownstate" hidden role="status"><h2>应用已退出</h2><p>可以关闭这个页面。</p></section>
<div class="workspace">
<section class="card importcard" aria-labelledby="importtitle">
<div class="cardhead"><h2 id="importtitle">对话</h2><button id="example" class="busyfield" type="button">载入示例</button></div>
<div class="importcontrols"><div class="importrow"><button id="chooseinputfolder" type="button" hidden>选择文件夹</button><button id="refreshinputfolder" type="button" hidden disabled>刷新</button><label class="filelabel" for="file">选择文件</label><input id="file" class="sr-only busyfield" type="file" accept=".xml,application/xml,text/xml" multiple></div>
<div id="inputfolderpath" class="folderpath" hidden></div><div id="filename" class="filename">XML 支持多选 · 原文件不变</div>
<div id="xmlpanel"><div id="xmlfiles" class="xmlfiles"></div><div class="xmltools"><label class="xmlunit" for="xmlunit">时间单位<select id="xmlunit" class="busyfield"><option value="ms">毫秒</option><option value="s">秒</option></select></label><button id="swapxml" class="busyfield" type="button">交换 A / B</button></div><p class="xmlhint">A / B 表示文件分组，不预设左右声道。</p></div>
<div id="batchpanel" hidden><div class="actions"><span id="batchfilecount" class="count"></span><label class="xmlunit">XML 时间单位<select id="batchunit" class="busyfield"><option value="ms">毫秒</option><option value="s">秒</option></select></label></div></div>
<button id="previewbutton" class="busyfield" type="button">解析并预览</button>
<div id="inputerror" class="error" role="alert" hidden></div><div id="warnings" class="warning" hidden></div>
</div>
<div id="previewmeta" class="previewhead" hidden></div>
<div id="previewempty" class="empty" style="margin-top:18px">导入成对 XML，解析后预览。</div><div id="preview" class="preview" hidden aria-label="对话预览"></div>
</section>
<div class="stack">
<section class="card voicecard" aria-labelledby="voicetitle">
<div class="cardhead"><h2 id="voicetitle">声音</h2></div>
<div id="voiceempty" class="empty">解析后自动匹配默认音色，可随时更换。</div><div id="voices" class="voices" hidden></div>
<div class="sliders">
<div><label class="sliderlabel" for="rate">语速<span id="ratevalue" class="value">1.00 ×</span></label><input id="rate" class="busyfield" type="range" min="0.5" max="2" step="0.05" value="1"></div>
<div><label class="sliderlabel" for="pause">段间停顿<span id="pausevalue" class="value">250 ms</span></label><input id="pause" class="busyfield" type="range" min="0" max="3000" step="50" value="250"></div>
</div>

<div id="outputfolderrow" class="folderrow" hidden><button id="chooseoutputfolder" type="button">结果文件夹</button><span id="outputfolderpath" class="folderpath">未选择 · 生成后手动保存</span><button id="openoutputfolder" type="button" disabled>打开</button></div><label class="regenerate"><input id="regenerate" type="checkbox">重新生成已完成的通话</label><div id="foldererror" class="error" role="alert" hidden></div><label class="consent"><input id="consent" class="busyfield" type="checkbox"><span>允许将本次文本发送给微软合成语音</span></label>
<div class="runbuttons"><button id="generate" class="primary" type="button" disabled>生成完整 MP3</button><button id="cancel" class="danger" type="button" hidden>取消</button></div>
<div id="joberror" class="error" role="alert" hidden></div>
<div id="statusbox" class="status" aria-live="polite" hidden><span id="status"></span><progress id="progress" value="0" max="1"></progress></div>
</section>
<section id="batchresult" class="card result" hidden><div class="cardhead"><h2>批次结果</h2><div class="actions"><button id="retrybatch" type="button" hidden>重试失败</button><a id="batchzip" class="button primary" download="dialogues.zip" hidden>下载 ZIP</a></div></div><div id="batchresults"></div></section>
<section id="result" class="card result" hidden aria-labelledby="resulttitle"><div class="cardhead"><h2 id="resulttitle">试听与下载</h2><span id="duration" class="muted"></span></div><audio id="audio" controls preload="metadata"></audio><div class="actions"><a id="download" class="button primary" download="dialogue.mp3">下载 MP3</a></div></section>
<section id="savedstate" class="savedstate" hidden aria-live="polite"><span id="savedlabel">已保存</span><span id="savedpath" class="savepath"></span><button id="revealsaved" type="button">打开所在文件夹</button><span id="saveerror" class="error" hidden></span></section>
</div>
</div>
<footer class="footer"><span>通用音色 · 只使用已脱敏文本</span><details><summary>服务说明</summary><p>解析在本机完成，合成时需要联网。不会克隆原声或自动对齐原录音时间轴；在线服务可能限流或中断。</p></details></footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let config=null, parsed=null, voiceMap=Object.create(null), activeJob=null, pollTimer=null, requestSequence=0, pending=false, fileReadSequence=0, readingFile=false, pendingRequestId=null, pendingPayloadKey=null, sourceFormat='xml_pair', xmlFiles=[], batchFiles=[], batchGroups=[], batchPairs=[], batchExcluded=new Set(), activeBatch=false, lastBatch=null;
let savedFile=null, pendingExportTarget=null;
// Folder capabilities live only in this page session; paths are display-only.
let inputFolder=null, outputFolder=null, folderChoosing=false, folderExports=0, completedRecords=new Map();
const exportTargets=new Map(), exportRecords=new Map();
let exportQueue=Promise.resolve();
function folderAvailable(){return !!window.webkit?.messageHandlers?.dialogueFolders||typeof window.pywebview?.api?.choose_input_directory==='function';}
const folderRequests=new Map();
window.dialogueNativeFolderResponse=function(message){const request=folderRequests.get(message?.request_id);if(!request)return;folderRequests.delete(message.request_id);request(message.result);};
function folderCall(action,args={}){
 if(window.webkit?.messageHandlers?.dialogueFolders)return new Promise(resolve=>{const request_id=requestId();folderRequests.set(request_id,resolve);window.webkit.messageHandlers.dialogueFolders.postMessage({request_id,method:action,args});});
 const native=window.pywebview?.api;if(!native)return Promise.reject(new Error('当前版本尚未支持文件夹选择。'));
 if(['get_preferences','choose_input_directory','choose_output_directory'].includes(action))return native[action]();
 if(action==='set_preferences')return native.set_preferences(args);
 if(action==='refresh_input_directory')return native.refresh_input_directory(args.folder_id);
 if(action==='check_completed')return native.check_completed(args.folder_id,args.fingerprints);
 if(action==='save_to_output')return native.save_to_output(args.resource_path,args.folder_id);
 if(action==='reveal_output')return native.reveal_output(args.folder_id);
 return Promise.reject(new Error('不支持的文件夹操作。'));
}
function refreshFolderControls(){const available=folderAvailable();$('chooseinputfolder').hidden=!available;$('outputfolderrow').hidden=!available;const busy=folderChoosing||folderExports>0||pending||readingFile||!!activeJob;$('chooseinputfolder').disabled=busy;$('refreshinputfolder').hidden=!available;$('refreshinputfolder').disabled=busy||!inputFolder?.valid;$('chooseoutputfolder').disabled=busy;$('regenerate').disabled=busy;$('openoutputfolder').disabled=!outputFolder||folderChoosing;}
function validFolder(result){return result?.ok===true&&typeof result.folder_id==='string'&&/^[A-Za-z0-9_-]{1,100}$/.test(result.folder_id)&&typeof result.path==='string'&&result.path.length>0&&result.path.length<=4096;}
function validateFolderFiles(files){if(!Array.isArray(files)||!files.length)throw new Error('这个文件夹没有可读取的 XML 文件。');if(files.length>100)throw new Error('最多选择 100 个 XML 文件。');let total=0;for(const file of files){if(typeof file.name!=='string'||!/^[^/\\]+\.xml$/i.test(file.name)||typeof file.content!=='string')throw new Error('文件夹返回了无效 XML 文件。');const bytes=new TextEncoder().encode(file.content).length;if(bytes>2*1024*1024)throw new Error('每个 XML 不得超过 2 MB。');total+=bytes;}if(total>20*1024*1024)throw new Error('XML 合计不得超过 20 MB。');return files.map(f=>({name:f.name,content:f.content}));}
async function loadInputFolder(refresh=false){if(folderChoosing||folderExports||pending||readingFile||activeJob)return;folderChoosing=true;lock(true);try{const result=await folderCall(refresh?'refresh_input_directory':'choose_input_directory',refresh?{folder_id:inputFolder.folder_id}:{});if(result?.cancelled)return;if(!validFolder(result))throw new Error(result?.error||'文件夹未载入，请重新选择。');const files=validateFolderFiles(result.files);invalidate();inputFolder={folder_id:result.folder_id,path:result.path,valid:true};batchFiles=files;batchPairs=[];batchExcluded.clear();xmlFiles=[];setSourceMode('batch');renderBatchFiles();$('inputfolderpath').textContent=result.path;$('inputfolderpath').title=result.path;$('inputfolderpath').hidden=false;$('filename').textContent='已载入 '+files.length+' 个 XML · 仅当前文件夹';$('file').value='';folderChoosing=false;lock(false);await preview();}catch(e){errorAt('inputerror',e.message||'文件夹未载入。');}finally{folderChoosing=false;lock(false);}}
$('chooseinputfolder').addEventListener('click',()=>loadInputFolder());$('refreshinputfolder').addEventListener('click',()=>loadInputFolder(true));
$('chooseoutputfolder').addEventListener('click',async()=>{if(folderChoosing||folderExports||pending||readingFile||activeJob)return;folderChoosing=true;refreshFolderControls();try{const result=await folderCall('choose_output_directory');if(result?.cancelled)return;if(!validFolder(result))throw new Error(result?.error||'结果文件夹未选择。');outputFolder={folder_id:result.folder_id,path:result.path};$('outputfolderpath').textContent=result.path;$('outputfolderpath').title=result.path;errorAt('foldererror','');folderChoosing=false;if(parsed)await preview();}catch(e){errorAt('foldererror',e.message||'结果文件夹未选择。');}finally{folderChoosing=false;refreshFolderControls();}});
$('openoutputfolder').addEventListener('click',async()=>{if(!outputFolder)return;try{const result=await folderCall('reveal_output',{folder_id:outputFolder.folder_id});if(result?.ok!==true)throw new Error('无法打开结果文件夹，请根据路径查找。');errorAt('foldererror','');}catch(e){errorAt('foldererror',e.message||'无法打开结果文件夹。');}});
const knownVoices=new Set(['zh-CN-XiaoxiaoNeural','zh-CN-XiaoyiNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural']);
async function restoreFolderPreferences(){if(!folderAvailable())return;try{const result=await folderCall('get_preferences');if(!result?.ok)return;if(typeof result.rate==='number'&&Number.isFinite(result.rate)&&result.rate>=0.5&&result.rate<=2){$('rate').value=result.rate;$('ratevalue').textContent=result.rate.toFixed(2)+' ×';}if(Number.isInteger(result.pause_ms)&&result.pause_ms>=0&&result.pause_ms<=3000){$('pause').value=result.pause_ms;$('pausevalue').textContent=result.pause_ms+' ms';}for(const [key,value]of Object.entries(result.voices||{}))if(knownVoices.has(value))voiceMap[key]=value;const input=result.input_folder;if(input&&typeof input.path==='string'){inputFolder=input;$('inputfolderpath').textContent=input.path+(input.valid?' · 点击刷新载入':' · 请重新选择');$('inputfolderpath').title=input.path;$('inputfolderpath').hidden=false;}const output=result.output_folder;if(output&&typeof output.path==='string'){$('outputfolderpath').textContent=output.path+(output.valid?'':' · 请重新选择');$('outputfolderpath').title=output.path;if(output.valid&&validFolder({...output,ok:true}))outputFolder=output;}}catch(e){errorAt('foldererror','设置暂未恢复，可重新选择文件夹。');}finally{refreshFolderControls();}}
async function persistVoices(){if(!folderAvailable())return;const voices=Object.fromEntries(Object.entries(voiceMap).filter(([,v])=>knownVoices.has(v)));try{const result=await folderCall('set_preferences',{voices,rate:Number($('rate').value),pause_ms:Number($('pause').value)});if(result?.ok!==true)errorAt('foldererror','音色设置暂未保存，下次打开可能恢复默认。');}catch(e){errorAt('foldererror','音色设置暂未保存。');}}
function alreadyCompleted(fingerprint){return !$('regenerate').checked&&completedRecords.has(fingerprint);}
async function checkCompleted(result){completedRecords.clear();if(!outputFolder)return;const fingerprints=(sourceFormat==='batch'?(result.groups||[]).filter(g=>g.status==='ready').map(g=>g.fingerprint):[result.fingerprint]).filter(f=>typeof f==='string'&&/^[a-f0-9]{64}$/.test(f));if(!fingerprints.length)return;const checked=await folderCall('check_completed',{folder_id:outputFolder.folder_id,fingerprints});if(checked?.ok!==true)throw new Error('无法核实已有结果，请重新选择结果文件夹后重试。');for(const record of checked.completed||[])if(fingerprints.includes(record.fingerprint)&&typeof record.path==='string')completedRecords.set(record.fingerprint,record);}
$('regenerate').addEventListener('change',()=>{resetRequest();if(sourceFormat==='batch'&&parsed)displayBatchPreview({groups:batchGroups});else updateGenerate();});
function exportKey(route,target){return target.folder_id+'|'+route;}
function refreshExportRows(){document.querySelectorAll('[data-export-route]').forEach(row=>{const record=exportRecords.get(row.dataset.exportKey);row.replaceChildren();if(!record)return;const label=document.createElement('span');label.className='exportlabel';label.textContent=record.status==='saved'?'已保存 · '+record.path:record.status==='saving'?'正在保存…':'保存失败 · 可重试，无需重新合成';label.title=record.path||record.target.path||'';row.append(label);if(record.status==='error'){const retry=document.createElement('button');retry.type='button';retry.textContent='重试保存';retry.onclick=()=>exportAudio(record.route,record.target,true);row.append(retry);}});}
function appendExportState(parent,route,jobId){const target=exportTargets.get(jobId);if(!target)return;const row=document.createElement('div');row.className='exportstate';row.dataset.exportRoute=route;row.dataset.exportKey=exportKey(route,target);parent.append(row);}
async function exportAudio(route,target,retry=false){if(!target||!safeBatchDownload(route)||route.endsWith('/zip'))return;const key=exportKey(route,target),old=exportRecords.get(key);if(old&&(old.status!=='error'||!retry))return;const record={route,target,status:'saving'};exportRecords.set(key,record);folderExports++;lock(false);refreshExportRows();try{const saving=exportQueue.then(()=>folderCall('save_to_output',{resource_path:route,folder_id:target.folder_id}));exportQueue=saving.catch(()=>{});const result=await saving;if(result?.ok!==true||typeof result.path!=='string'||!result.path||typeof result.name!=='string'||typeof result.save_id!=='string')throw new Error('保存未完成');record.status='saved';record.path=result.path;if(typeof result.fingerprint==='string')completedRecords.set(result.fingerprint,result);window.dialogueNativeSaved(result);}catch(e){record.status='error';}finally{folderExports--;lock(false);refreshExportRows();}}
function exportBatch(batch){const target=exportTargets.get(batch.id);if(!target)return;for(const item of batch.items||[])if(item.status==='done')exportAudio(item.download_url,target);}
window.addEventListener('pywebviewready',()=>{refreshFolderControls();restoreFolderPreferences();});
refreshFolderControls();

// Native hosts invoke this only after a user-selected save has completed.
window.dialogueNativeSaved=function(record){
if(typeof record?.resource_path==='string'&&/^\/api\/(jobs|batches)\//.test(record.resource_path)){savedResourcePaths.add(record.resource_path);showPendingUpdateSaves();}
if(!record||typeof record.save_id!=='string'||!/^[A-Za-z0-9_-]{1,100}$/.test(record.save_id)||typeof record.path!=='string'||!record.path||record.path.length>4096||typeof record.name!=='string')return;
const available=!!window.webkit?.messageHandlers?.dialogueReveal||typeof window.pywebview?.api?.reveal_saved==='function';if(!available)return;
savedFile={save_id:record.save_id};$('savedlabel').textContent='已保存 · '+record.name.slice(0,200);$('savedpath').textContent=record.path;$('savedpath').title=record.path;$('savedstate').hidden=false;errorAt('saveerror','');$('revealsaved').disabled=false;
};
window.dialogueNativeRevealResult=function(result){$('revealsaved').disabled=false;if(!result||result.ok!==true)errorAt('saveerror','暂时无法打开文件夹，请根据上方路径查找。');else errorAt('saveerror','');};
$('revealsaved').addEventListener('click',async()=>{if(!savedFile)return;$('revealsaved').disabled=true;errorAt('saveerror','');try{
if(window.webkit?.messageHandlers?.dialogueReveal){window.webkit.messageHandlers.dialogueReveal.postMessage({save_id:savedFile.save_id});}
else if(typeof window.pywebview?.api?.reveal_saved==='function'){const result=await window.pywebview.api.reveal_saved(savedFile.save_id);window.dialogueNativeRevealResult(result);}
else throw new Error('Native reveal unavailable');
}catch(e){window.dialogueNativeRevealResult({ok:false});}});
// Windows uses a native save dialog and records only completed, user-selected saves.
let nativeSavePending=false;
document.addEventListener('click',async event=>{const link=event.target.closest?.('a[download]');if(!link||typeof window.pywebview?.api?.save_download!=='function')return;const raw=link.getAttribute('href');if(typeof raw!=='string'||!/^\/api\/(?:jobs\/[A-Za-z0-9_-]+\/audio|batches\/[A-Za-z0-9_-]+\/(?:zip|audio\/\d{3}))$/.test(raw))return;event.preventDefault();if(nativeSavePending)return;nativeSavePending=true;link.setAttribute('aria-busy','true');errorAt('joberror','');try{const result=await window.pywebview.api.save_download(raw);if(!result?.ok&&!result?.cancelled)errorAt('joberror','保存未完成，请重新选择保存位置后重试。');}catch(e){errorAt('joberror','保存未完成，请稍后重试。');}finally{nativeSavePending=false;link.removeAttribute('aria-busy');}});
function resetRequest(){pendingRequestId=null;pendingPayloadKey=null;pendingExportTarget=null;}
function requestId(){return crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');}
function rememberJob(id){try{if(id)sessionStorage.setItem('dialogue.activeJob',(activeBatch?'batch:':'')+id);else sessionStorage.removeItem('dialogue.activeJob');}catch(e){}}
function restoreJob(){try{return sessionStorage.getItem('dialogue.activeJob');}catch(e){return null;}}
function errorAt(id,message){$(id).textContent=message||'';$(id).hidden=!message;}
function clearResult(){ $('audio').pause();$('audio').removeAttribute('src');$('audio').load();$('result').hidden=true;$('download').removeAttribute('href'); }
function lineCount(){if(sourceFormat==='batch')return batchGroups.filter(g=>g.status==='ready'&&!batchExcluded.has(g.id)&&!alreadyCompleted(g.fingerprint)).reduce((n,g)=>n+(g.preview?.script?.lines?.length||0),0);if(alreadyCompleted(parsed?.fingerprint))return 0;return Array.isArray(parsed?.script?.lines)?parsed.script.lines.length:(parsed?.rows||[]).filter(row=>!row.muted).length;}
function updateGenerate(){ $('generate').disabled=!config||!parsed||!lineCount()||!$('consent').checked||!!activeJob||pending||readingFile||folderChoosing||folderExports>0;if(sourceFormat==='batch'){const included=batchGroups.filter(g=>g.status==='ready'&&!batchExcluded.has(g.id)&&!alreadyCompleted(g.fingerprint)).length;const skipped=batchGroups.length-included;$('generate').textContent='生成 '+included+' 通'+(skipped?' · 跳过 '+skipped+' 组':'');} }
function lock(value){const disabled=!!(value||pending||readingFile||activeJob||folderChoosing||folderExports);document.querySelectorAll('.busyfield').forEach(el=>el.disabled=disabled||el.dataset.unavailable==='true');$('cancel').hidden=!activeJob;updateGenerate();refreshFolderControls();}
function invalidate(){batchGroups=[];$('batchresult').hidden=true;requestSequence++;resetRequest();parsed=null;$('preview').replaceChildren();$('preview').hidden=true;$('previewmeta').hidden=true;$('previewempty').hidden=false;$('voices').replaceChildren();$('voices').hidden=true;$('voiceempty').hidden=false;errorAt('inputerror','');$('warnings').hidden=true;clearResult();if(!activeJob)$('statusbox').hidden=true;updateGenerate();}
function setSourceMode(mode){sourceFormat=mode;$('xmlpanel').hidden=mode!=='xml_pair';$('batchpanel').hidden=mode!=='batch';$('generate').textContent=mode==='batch'?'生成批次 MP3':'生成完整 MP3';}
function renderXmlFiles(){$('xmlfiles').replaceChildren();xmlFiles.forEach((file,index)=>{const row=document.createElement('div');row.className='xmlfile';const channel=document.createElement('span');channel.className='channel';channel.textContent=index===0?'A':'B';const name=document.createElement('span');name.className='filetext';name.textContent=file.name;row.append(channel,name);$('xmlfiles').append(row);});}
function sourcePayload(){const common={rate:Number($('rate').value),pause_ms:Number($('pause').value),voices:{...voiceMap}};if(sourceFormat==='batch')return{files:batchFiles,pairs:[],excluded:[...new Set([...batchExcluded,...batchGroups.filter(g=>g.status!=='ready'||alreadyCompleted(g.fingerprint)).map(g=>g.id)])],xml_time_unit:$('batchunit').value,...common};if(sourceFormat==='xml_pair'){if(xmlFiles.length!==2)throw new Error('请同时选择同一通对话的两个 XML 文件。');return{format:'xml_pair',xml_time_unit:$('xmlunit').value,xml_files:xmlFiles.map(file=>({name:file.name,content:file.content})),...common};}throw new Error('请选择 XML 文件。');}
function timestamp(value){const ms=Math.max(0,Math.floor(value));const hours=Math.floor(ms/3600000),minutes=Math.floor(ms/60000)%60,seconds=Math.floor(ms/1000)%60;return(hours?String(hours).padStart(2,'0')+':':'')+String(minutes).padStart(2,'0')+':'+String(seconds).padStart(2,'0')+'.'+String(ms%1000).padStart(3,'0');}
async function api(path,options={}){const headers={'Accept':'application/json',...(options.headers||{})};if(options.body){headers['Content-Type']='application/json';headers['X-App-Token']=config.token;}let response;try{response=await fetch(path,{...options,headers,credentials:'same-origin',cache:'no-store'});}catch(e){throw new Error('无法连接本机服务，请确认后端仍在运行。');}let data;try{data=await response.json();}catch(e){throw new Error('服务返回了无法识别的响应。');}if(!response.ok){const error=new Error(data.error||data.message||'请求失败（'+response.status+'）');error.status=response.status;throw error;}return data;}
function pill(text){const el=document.createElement('span');el.className='count';el.textContent=text;return el;}

const defaults=['zh-CN-XiaoxiaoNeural','zh-CN-XiaoyiNeural'];const old=voiceMap;voiceMap=Object.create(null);$('voices').replaceChildren();speakers.forEach((speaker,index)=>{const key=typeof speaker==='string'?speaker:String(speaker.id??speaker.speaker);const row=document.createElement('div');row.className='voicerow';const label=document.createElement('label');label.className='speakername';label.textContent=key;const hint=document.createElement('span');hint.className='voicehint';hint.textContent='固定角色音色';label.append(hint);const select=document.createElement('select');select.className='busyfield';select.id='voice-'+index;label.htmlFor=select.id;(config.voices||[]).forEach(voice=>{const option=document.createElement('option');option.value=voice.id;option.textContent=voice.label;select.append(option);});const roleKey=key.trim().toUpperCase();select.value=old[key]||(roleKey==='AGENT'||roleKey==='A'?defaults[0]:roleKey==='USER'||roleKey==='B'?defaults[1]:defaults[index%defaults.length]);if(!select.value&&select.options.length)select.selectedIndex=0;voiceMap[key]=select.value;select.addEventListener('change',()=>{voiceMap[key]=select.value;resetRequest();clearResult();persistVoices();preview();});row.append(label,select);$('voices').append(row);});$('voices').hidden=false;$('voiceempty').hidden=true;const warnings=[...(result.warnings||[])];if(sourceFormat==='xml_pair'&&!warnings.some(value=>String(value).includes('不还原原始时长'))){warnings.push('按时间排序串行配音，不还原原始时长。');}$('warnings').textContent=warnings.join('\n');$('warnings').hidden=!warnings.length;updateGenerate();}

async function poll(){if(activeBatch)return pollBatch();if(!activeJob)return;const id=activeJob;try{const job=await api('/api/jobs/'+encodeURIComponent(id));if(activeJob!==id)return;errorAt('joberror','');const finished=['done','error','cancelled'].includes(job.status);if(job.status==='done'){setStatus('全部完成 · '+job.total+' 句',job.total,job.total);$('duration').textContent=Number.isFinite(job.duration_ms)?(job.duration_ms/1000).toFixed(1)+' 秒':'';if(job.download_url){generatedResourcePaths.set(job.download_url,'dialogue.mp3');$('audio').src=job.download_url;$('download').href=job.download_url;}$('result').hidden=false;const target=exportTargets.get(id);$('result').querySelectorAll('.exportstate').forEach(el=>el.remove());appendExportState($('result'),job.download_url,id);exportAudio(job.download_url,target);refreshExportRows();}else if(job.status==='error'){errorAt('joberror',job.error||'语音生成失败，请稍后重试。');setStatus('生成未完成',job.completed,job.total);}else if(job.status==='cancelled'){setStatus('已取消，本次未完成的音频不会作为结果导出。',job.completed,job.total);}else{setStatus((job.status==='queued'?'等待开始':'正在合成')+' · '+(job.completed||0)+' / '+(job.total||lineCount()||0)+' 句',job.completed,job.total);}

async function generate(){if(!parsed||!lineCount()||pending||activeJob||!$('consent').checked)return;errorAt('joberror','');clearResult();pending=true;lock(true);setStatus('正在提交合成任务…',0,lineCount());try{const payload=sourcePayload();payload.consent=true;const key=JSON.stringify(payload);if(!pendingRequestId||pendingPayloadKey!==key){pendingRequestId=requestId();pendingPayloadKey=key;pendingExportTarget=outputFolder?{...outputFolder}:null;}payload.request_id=pendingRequestId;const job=await api(sourceFormat==='batch'?'/api/batches':'/api/jobs',{method:'POST',body:JSON.stringify(payload)});activeJob=job.id;if(!exportTargets.has(job.id))exportTargets.set(job.id,pendingExportTarget);activeBatch=sourceFormat==='batch';rememberJob(activeJob);$('cancel').disabled=false;$('cancel').textContent='取消';$('cancel').hidden=false;poll();}catch(e){errorAt('joberror',e.message+(e.status?'':' 提交结果尚未确认；可点击生成重试，同一请求会复用编号，避免重复创建任务。'));$('statusbox').hidden=true;}finally{pending=false;lock(!!activeJob);}}
