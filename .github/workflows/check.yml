name: Project checks
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: npm ci
      - run: python tools/check.py
