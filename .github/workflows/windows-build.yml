name: Build Windows app
on:
  workflow_dispatch:
    inputs:
      confirm_upgrade:
        description: Verify official v0.3.4 to v0.4.0 after confirming the isolated OS prompt
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Install build dependencies
        run: python -m pip install --require-hashes -r requirements-windows-build.lock
      - name: Run unit tests
        run: python -m unittest discover -s web_dialogue -t . -p "test_*.py" -v
      - name: Run updater transaction tests
        run: python -m unittest test_safe_updater test_windows_ci_classification test_gitee_provider test_update_sources -v
      - name: Package and verify the Windows application
        run: python tools/build_windows.py
      - name: Verify official release upgrade after system confirmation
        if: inputs.confirm_upgrade == true
        env:
          GH_TOKEN: ${{ github.token }}
          DIALOGUE_CONFIRM_TEST_UPDATE: '1'
          DIALOGUE_RELEASE_OLD_VERSION: '0.3.4'
        shell: pwsh
        run: |
          gh release download v0.3.4 --pattern DialogueTTS-Windows-x64.zip --dir verification/official-old
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release download v0.4.0 --pattern DialogueTTS-Windows-x64.zip --dir verification/official-new
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $oldZip = 'verification/official-old/DialogueTTS-Windows-x64.zip'
          $newZip = 'verification/official-new/DialogueTTS-Windows-x64.zip'
          if ((Get-FileHash $oldZip).Hash.ToLower() -ne 'e3a7c4ae6fda7a940667fe5bf8afe354c6986444e6f63c6b7564d4342ce1ad4e') { throw 'Old release hash mismatch' }
          if ((Get-FileHash $newZip).Hash.ToLower() -ne 'eff63ed7bda78150e59f831c294cfef66cde1557e5f665675943e1d969371490') { throw 'New release hash mismatch' }
          Expand-Archive $oldZip verification/official-old/extracted
          Expand-Archive $newZip verification/official-new/extracted
          $oldExe = @(Get-ChildItem verification/official-old/extracted -Recurse -Filter DialogueTTS.exe)
          $newExe = @(Get-ChildItem verification/official-new/extracted -Recurse -Filter DialogueTTS.exe)
          if ($oldExe.Count -ne 1 -or $newExe.Count -ne 1) { throw 'Ambiguous release executable' }
          $env:DIALOGUE_RELEASE_NEW_EXE = $newExe[0].FullName
          python tools/windows_upgrade_smoke.py $oldExe[0].FullName dist/windows-upgrade-confirmed.json
          exit $LASTEXITCODE
      - name: Retain the real build and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DialogueTTS-Windows-x64
          if-no-files-found: error
          path: |
            dist/DialogueTTS-Windows-x64.zip
            dist/DialogueTTS-Windows-x64.zip.sha256
            dist/windows-smoke.json
            dist/windows-smoke.mp3
            dist/windows-gui-smoke.json
            dist/windows-gui-*.png
            dist/windows-upgrade-smoke.json
            dist/windows-upgrade-confirmed.json
            dist/windows-update-prompt-*.png
            dist/windows-update-target-*.png
