name: Build Windows app
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install build dependencies
        run: python -m pip install -r requirements-windows-build.txt
      - name: Run unit tests
        run: python -m unittest discover -s web_dialogue -t . -p "test_*.py" -v
      - name: Run updater transaction tests
        run: python -m unittest test_safe_updater -v
      - name: Package and verify the Windows application
        run: python tools/build_windows.py
      - name: Retain the real build and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DialogueTTS-Windows-x64
          if-no-files-found: error
          path: |
            dist/DialogueTTS-Windows-x64.zip
            dist/DialogueTTS-Windows-x64.zip.sha256
            dist/windows-smoke.json
            dist/windows-smoke.mp3
            dist/windows-gui-smoke.json
            dist/windows-upgrade-smoke.json
